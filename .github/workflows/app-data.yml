# Cron: lê a API do Baldio e publica app/data/projectos.json (com as capas) neste repo.
# O GitHub Pages serve-o com CORS aberto em https://baldio-eu.github.io/app/data/projectos.json
name: Dados da app

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none

      - run: php scripts/build-app-data.php

      - name: Publicar se mudou
        run: |
          git add -A app/data
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898213+github-actions[bot]@users.noreply.github.com'
          git commit -m "Dados da app: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
