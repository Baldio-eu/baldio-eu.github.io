<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projectos do Baldio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <header class="mb-4">
      <h1 class="h3 mb-1">Projectos do Baldio</h1>
      <p class="text-secondary mb-0">
        Lidos em directo de <a href="https://baldio.eu/baldio.json" target="_blank" rel="noopener">baldio.eu/baldio.json</a>
        <span id="updated"></span>
      </p>
    </header>

    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <input id="search" type="search" class="form-control" placeholder="Pesquisar por nome ou localidade">
      </div>
      <div class="col-md-4">
        <select id="type" class="form-select">
          <option value="">Todos os tipos</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-center">
        <span id="count" class="text-secondary small"></span>
      </div>
    </div>

    <div id="status" class="alert alert-light">A carregar…</div>
    <div id="list" class="row g-3"></div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
